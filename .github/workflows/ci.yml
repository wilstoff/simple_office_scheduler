name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/SimpleOfficeScheduler/ClientApp/package-lock.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Install Playwright browsers
        run: |
          dotnet tool install --global Microsoft.Playwright.CLI
          playwright install chromium --with-deps

      - name: Test
        run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 7

  docker-build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:latest -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Save Docker image
        run: docker save ghcr.io/${{ github.repository }}:latest | gzip > image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build-and-publish
    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: gunzip -c image.tar.gz | docker load

      - name: Start container
        run: |
          docker run -d --name scheduler-smoke \
            -p 8080:8080 \
            -e ActiveDirectory__Enabled=false \
            -e SeedUser__Enabled=true \
            -e SeedUser__ExtraUsers__0__Username=alice \
            -e SeedUser__ExtraUsers__0__Password=Test123! \
            -e SeedUser__ExtraUsers__0__DisplayName=Alice \
            -e SeedUser__ExtraUsers__0__Email=alice@localhost \
            -e GraphApi__Rooms__0__Email=ci-room@example.com \
            -e "GraphApi__Rooms__0__DisplayName=CI Room" \
            -e GraphApi__Rooms__0__Capacity=10 \
            ghcr.io/${{ github.repository }}:latest

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/login > /dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "App failed to start"
          docker logs scheduler-smoke
          exit 1

      - name: Smoke test - login, create event, signup
        run: |
          set -e

          # 0. Verify critical static assets are served
          curl -sf http://localhost:8080/_framework/blazor.web.js > /dev/null \
            || { echo "FAIL: blazor.web.js not served"; exit 1; }
          curl -sf http://localhost:8080/js/fullcalendar-interop.js > /dev/null \
            || { echo "FAIL: fullcalendar-interop.js not served"; exit 1; }
          echo "Static asset checks OK"

          # 1. Login
          LOGIN=$(curl -sf -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -c cookies.txt \
            -d '{"username":"testadmin","password":"Test123!"}')
          echo "Login OK: $(echo "$LOGIN" | jq -r .displayName)"

          # 2. Create event
          EVENT=$(curl -sf -X POST http://localhost:8080/api/events \
            -H "Content-Type: application/json" \
            -b cookies.txt \
            -d '{
              "title":"CI Smoke Test Event",
              "startTime":"2099-01-15T09:00:00",
              "endTime":"2099-01-15T10:00:00",
              "capacity":5
            }')
          EVENT_ID=$(echo "$EVENT" | jq -r .id)
          OCC_ID=$(echo "$EVENT" | jq -r '.occurrences[0].id')
          echo "Event created: id=$EVENT_ID, occurrence=$OCC_ID"

          # 2b. Verify event times match what we sent (no timezone offset)
          EVT_START=$(echo "$EVENT" | jq -r .startTime)
          EVT_END=$(echo "$EVENT" | jq -r .endTime)
          OCC_START=$(echo "$EVENT" | jq -r '.occurrences[0].startTime')
          OCC_END=$(echo "$EVENT" | jq -r '.occurrences[0].endTime')
          echo "Event times: start=$EVT_START end=$EVT_END"
          echo "Occurrence times: start=$OCC_START end=$OCC_END"

          if [[ "$EVT_START" != *"09:00:00"* ]]; then
            echo "FAIL: event startTime shifted. Expected 09:00:00, got $EVT_START"
            exit 1
          fi
          if [[ "$EVT_END" != *"10:00:00"* ]]; then
            echo "FAIL: event endTime shifted. Expected 10:00:00, got $EVT_END"
            exit 1
          fi
          if [[ "$OCC_START" != *"09:00:00"* ]]; then
            echo "FAIL: occurrence startTime shifted. Expected 09:00:00, got $OCC_START"
            exit 1
          fi
          if [[ "$OCC_END" != *"10:00:00"* ]]; then
            echo "FAIL: occurrence endTime shifted. Expected 10:00:00, got $OCC_END"
            exit 1
          fi
          echo "Time validation OK: event and occurrence times match sent values"

          # 3. Sign up for event
          curl -sf -X POST "http://localhost:8080/api/events/${EVENT_ID}/signup/${OCC_ID}" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"message":"Smoke test topic"}'
          echo "Signup OK"

          # 4. Verify signup
          VERIFY=$(curl -sf "http://localhost:8080/api/events/${EVENT_ID}" \
            -b cookies.txt)
          SIGNUP_COUNT=$(echo "$VERIFY" | jq -r '.occurrences[0].signupCount')
          if [ "$SIGNUP_COUNT" -ne 1 ]; then
            echo "FAIL: expected signupCount=1, got $SIGNUP_COUNT"
            exit 1
          fi
          echo "Verified: signupCount=$SIGNUP_COUNT"

          # ── Tech Meeting smoke test ──────────────────────────────

          # 5. Create tech meeting
          TECH_EVENT=$(curl -sf -X POST http://localhost:8080/api/events \
            -H "Content-Type: application/json" \
            -b cookies.txt \
            -d '{
              "title":"CI Tech Meeting",
              "startTime":"2099-02-15T14:00:00",
              "endTime":"2099-02-15T15:00:00",
              "capacity":5,
              "eventType":1
            }')
          TECH_ID=$(echo "$TECH_EVENT" | jq -r .id)
          TECH_OCC_ID=$(echo "$TECH_EVENT" | jq -r '.occurrences[0].id')
          TECH_TYPE=$(echo "$TECH_EVENT" | jq -r .eventType)
          echo "Tech meeting created: id=$TECH_ID, occurrence=$TECH_OCC_ID, type=$TECH_TYPE"

          if [ "$TECH_TYPE" != "TechMeeting" ] && [ "$TECH_TYPE" != "1" ]; then
            echo "FAIL: expected eventType=TechMeeting or 1, got $TECH_TYPE"
            exit 1
          fi

          # 6. Signup on regular tech meeting should fail
          SIGNUP_FAIL=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "http://localhost:8080/api/events/${TECH_ID}/signup/${TECH_OCC_ID}" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"message":"Should fail"}')
          if [ "$SIGNUP_FAIL" -ne 400 ]; then
            echo "FAIL: signup on regular tech meeting should return 400, got $SIGNUP_FAIL"
            exit 1
          fi
          echo "Signup blocked on regular tech meeting: OK"

          # 7. Toggle to lightning talks
          curl -sf -X POST "http://localhost:8080/api/events/occurrences/${TECH_OCC_ID}/lightning-talks" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"isLightningTalks":true}'
          echo "Lightning talks enabled: OK"

          # 8. Signup on lightning talks should succeed
          curl -sf -X POST "http://localhost:8080/api/events/${TECH_ID}/signup/${TECH_OCC_ID}" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"message":"Lightning talk topic"}'
          echo "Lightning talks signup: OK"

          # 9. Verify lightning talks signup
          TECH_VERIFY=$(curl -sf "http://localhost:8080/api/events/${TECH_ID}" -b cookies.txt)
          TECH_SIGNUP_COUNT=$(echo "$TECH_VERIFY" | jq -r '.occurrences[0].signupCount')
          TECH_IS_LR=$(echo "$TECH_VERIFY" | jq -r '.occurrences[0].isLightningTalks')
          if [ "$TECH_SIGNUP_COUNT" -ne 1 ]; then
            echo "FAIL: expected tech meeting signupCount=1, got $TECH_SIGNUP_COUNT"
            exit 1
          fi
          if [ "$TECH_IS_LR" != "true" ]; then
            echo "FAIL: expected isLightningTalks=true, got $TECH_IS_LR"
            exit 1
          fi
          echo "Tech meeting verified: signupCount=$TECH_SIGNUP_COUNT, isLightningTalks=$TECH_IS_LR"

          # ── Workshop smoke test ──────────────────────────────────

          # 10. Find the seeded second user to co-own the workshop
          CO_OWNER_ID=$(curl -sf "http://localhost:8080/api/users/search?q=alice" -b cookies.txt \
            | jq -r '.[0].id')
          echo "Co-owner: id=$CO_OWNER_ID"
          if [ -z "$CO_OWNER_ID" ] || [ "$CO_OWNER_ID" = "null" ]; then
            echo "FAIL: could not find the seeded co-owner user"
            exit 1
          fi

          # 11. Create a workshop with an owning team
          WS_EVENT=$(curl -sf -X POST http://localhost:8080/api/events \
            -H "Content-Type: application/json" \
            -b cookies.txt \
            -d "{
              \"title\":\"CI Workshop\",
              \"startTime\":\"2099-03-15T14:00:00\",
              \"endTime\":\"2099-03-15T16:00:00\",
              \"capacity\":3,
              \"eventType\":2,
              \"coOwnerIds\":[${CO_OWNER_ID}]
            }")
          WS_ID=$(echo "$WS_EVENT" | jq -r .id)
          WS_OCC_ID=$(echo "$WS_EVENT" | jq -r '.occurrences[0].id')
          WS_TYPE=$(echo "$WS_EVENT" | jq -r .eventType)
          WS_CO_OWNERS=$(echo "$WS_EVENT" | jq -r '.coOwners | length')
          echo "Workshop created: id=$WS_ID, occurrence=$WS_OCC_ID, type=$WS_TYPE, coOwners=$WS_CO_OWNERS"

          if [ "$WS_TYPE" != "Workshop" ] && [ "$WS_TYPE" != "2" ]; then
            echo "FAIL: expected eventType=Workshop or 2, got $WS_TYPE"
            exit 1
          fi
          if [ "$WS_CO_OWNERS" -ne 1 ]; then
            echo "FAIL: expected 1 co-owner, got $WS_CO_OWNERS"
            exit 1
          fi

          # 12. A workshop signup takes no message, unlike office hours
          curl -sf -X POST "http://localhost:8080/api/events/${WS_ID}/signup/${WS_OCC_ID}" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"message":""}'
          echo "Workshop signup without a message: OK"

          # 13. Cancelling the last signup must not tear down the workshop meeting
          curl -sf -X DELETE "http://localhost:8080/api/events/${WS_ID}/signup/${WS_OCC_ID}" \
            -b cookies.txt
          WS_VERIFY=$(curl -sf "http://localhost:8080/api/events/${WS_ID}" -b cookies.txt)
          WS_SIGNUP_COUNT=$(echo "$WS_VERIFY" | jq -r '.occurrences[0].signupCount')
          if [ "$WS_SIGNUP_COUNT" -ne 0 ]; then
            echo "FAIL: expected workshop signupCount=0 after cancel, got $WS_SIGNUP_COUNT"
            exit 1
          fi
          echo "Workshop survives losing its last signup: OK"

          # 14. Co-owner list can be replaced
          curl -sf -X POST "http://localhost:8080/api/events/${WS_ID}/co-owners" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"userIds":[]}'
          WS_CO_OWNERS_AFTER=$(curl -sf "http://localhost:8080/api/events/${WS_ID}" -b cookies.txt \
            | jq -r '.coOwners | length')
          if [ "$WS_CO_OWNERS_AFTER" -ne 0 ]; then
            echo "FAIL: expected 0 co-owners after clearing, got $WS_CO_OWNERS_AFTER"
            exit 1
          fi
          echo "Co-owner list cleared: OK"

          # ── Room smoke test ──────────────────────────────────────

          # 15. The rooms endpoint responds with the configured list
          ROOMS=$(curl -sf http://localhost:8080/api/rooms -b cookies.txt)
          echo "Rooms endpoint returned: $ROOMS"
          ROOM_COUNT=$(echo "$ROOMS" | jq -r 'length')
          if [ "$ROOM_COUNT" -ne 1 ]; then
            echo "FAIL: expected 1 configured room, got $ROOM_COUNT"
            exit 1
          fi

          # 16. Booking that room marks future occurrences pending
          curl -sf -X POST "http://localhost:8080/api/events/${WS_ID}/room" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"roomEmail":"ci-room@example.com"}'
          ROOM_NAME=$(curl -sf "http://localhost:8080/api/events/${WS_ID}" -b cookies.txt \
            | jq -r '.roomDisplayName')
          if [ "$ROOM_NAME" != "CI Room" ]; then
            echo "FAIL: expected roomDisplayName=CI Room, got $ROOM_NAME"
            exit 1
          fi
          echo "Room booked: $ROOM_NAME"

          # 17. An unknown room must be rejected rather than silently ignored
          BAD_ROOM=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "http://localhost:8080/api/events/${WS_ID}/room" \
            -b cookies.txt \
            -H "Content-Type: application/json" \
            -d '{"roomEmail":"nope@example.com"}')
          if [ "$BAD_ROOM" -ne 400 ]; then
            echo "FAIL: unknown room should return 400, got $BAD_ROOM"
            exit 1
          fi
          echo "Unknown room rejected: OK"

      - name: Stop container
        if: always()
        run: |
          docker logs scheduler-smoke
          docker rm -f scheduler-smoke
